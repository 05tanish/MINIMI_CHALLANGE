name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema
        run: node scripts/prisma.js validate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/minimi_ci
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/minimi_ci
      - name: Run test suite
        run: npm test
      - name: Build client
        run: npm run build
